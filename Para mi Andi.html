<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una carta bajo la luna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* Página nocturna por diseño: siempre oscura, en cualquier modo del sistema */
:root{
  color-scheme: dark;
  --noche:#020816; --halo:#8fd8ff; --menta:#7ff7e0; --texto:#dbe9ff; --tenue:#8fb0e0;
  --titulo:'Cinzel','Trajan Pro','Times New Roman',serif;
  --cuerpo:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--noche)}
body{margin:0;color:var(--texto);font-family:var(--cuerpo);background:transparent;overflow-x:hidden}

/* ---------- Escenario fijo: todo se mueve solo con transform/opacity (GPU) ---------- */
.escena{position:fixed;top:0;left:0;z-index:-5;opacity:0;transition:opacity 2.4s ease;will-change:transform}
.escena.lista{opacity:1}
.escena>div{position:absolute;pointer-events:none}
.foto{inset:0;background-size:100% 100%}
.rayos{left:30%;top:0;width:70%;height:52%;background-size:100% 100%;transform-origin:50% 0;animation:respira 9s ease-in-out infinite alternate}
@keyframes respira{from{opacity:.45;transform:rotate(-2.5deg) scaleX(.97)}to{opacity:1;transform:rotate(2.5deg) scaleX(1.04)}}
.bruma{left:-30%;width:160%;background:radial-gradient(45% 50% at 50% 50%,rgba(110,160,255,.15),transparent 70%);animation:deriva 38s ease-in-out infinite alternate}
.b1{top:38%;height:12%}
.b2{top:70%;height:10%;animation-duration:52s;animation-direction:alternate-reverse}
.b3{top:88%;height:10%;animation-duration:44s}
@keyframes deriva{from{transform:translateX(-9%)}to{transform:translateX(9%)}}
.agua{left:0;top:80%;width:100%;height:20%;overflow:hidden;opacity:.5;
  -webkit-mask-image:linear-gradient(transparent,#000 35%);mask-image:linear-gradient(transparent,#000 35%)}
.agua i{position:absolute;inset:0 -60px 0 0;
  background:repeating-linear-gradient(112deg,transparent 0 22px,rgba(130,200,255,.24) 30px,transparent 46px);
  animation:corre 4s linear infinite}
@keyframes corre{to{transform:translateX(-49.6px)}}
#luciernagas{position:fixed;inset:0;width:100%;height:100%;z-index:-3;pointer-events:none}

.vineta{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 40%,rgba(1,5,16,.72) 100%)}
.hilo{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:12vh;height:76vh;width:1px;z-index:3;pointer-events:none;
  background:linear-gradient(transparent,rgba(143,216,255,.28),transparent)}
.hilo i{position:absolute;left:-3px;top:0;width:7px;height:7px;border-radius:50%;background:#cfffff;
  box-shadow:0 0 12px 3px rgba(127,247,224,.8);will-change:transform}

/* ---------- Portada ---------- */
.portada{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem}
.portada h1{font-family:var(--titulo);font-weight:400;font-size:clamp(2.4rem,9vw,5.5rem);letter-spacing:.14em;margin:0;
  color:#eaf4ff;text-shadow:0 0 30px rgba(143,216,255,.65),0 0 80px rgba(60,120,255,.5);animation:surge 3.4s .6s ease-out both}
.portada p{font-style:italic;font-size:clamp(1.15rem,3.4vw,1.6rem);color:var(--tenue);margin:1.2rem 0 0;animation:surge 3.4s 1.4s ease-out both}
@keyframes surge{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:blur(0)}}
.orbe{margin-top:3.2rem;width:10px;height:10px;border-radius:50%;background:#dcffff;
  box-shadow:0 0 14px 4px rgba(127,247,224,.85),0 0 40px 10px rgba(80,160,255,.4);animation:flota 3s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(16px);opacity:.45}}

/* ---------- Carta: cristal redondeado con bordes que se difuminan (sin máscaras costosas) ---------- */
.carta{position:relative;z-index:2;width:min(41rem,calc(100% - 2.6rem));margin:0 auto;padding:clamp(1.8rem,6vw,3.5rem) clamp(1.1rem,5vw,3.5rem)}
.carta::before{content:"";position:absolute;inset:-1.8rem -1.2rem;z-index:-2;border-radius:3rem;pointer-events:none;
  background:rgba(2,8,26,.6);box-shadow:0 0 2.4rem 1.5rem rgba(2,8,26,.6),0 0 7rem 2.5rem rgba(40,100,255,.13)}
.carta::after{content:"";position:absolute;inset:-.9rem -.5rem;z-index:-1;border-radius:2.4rem;pointer-events:none;
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);box-shadow:inset 0 0 40px 4px rgba(120,180,255,.12)}
.carta p{font-size:clamp(1.2rem,3.9vw,1.42rem);line-height:1.75;margin:0 0 1.5em;white-space:pre-line;overflow-wrap:break-word;hyphens:none;text-wrap:pretty}
.carta p.nace{opacity:0;transition:opacity 1.6s ease}
.carta p.nace.vista{opacity:1}
.carta .firma{font-family:var(--titulo);font-size:clamp(1.05rem,3.4vw,1.3rem);letter-spacing:.08em;text-align:right;
  color:var(--menta);margin-top:2.2rem;text-shadow:0 0 18px rgba(127,247,224,.5)}
.final{position:relative;z-index:2;text-align:center;padding:3rem 1rem 7rem;color:var(--tenue);font-style:italic}

/* calidad adaptable: si el equipo va justo, la página se aligera sola */
.q1 .carta::after{display:none}
.q1 .carta::before{background:rgba(2,8,26,.74)}
.q2 .rayos,.q2 .bruma,.q2 .agua i{animation:none}
@media (prefers-reduced-motion:reduce){
  .rayos,.bruma,.agua i,.orbe,.portada h1,.portada p{animation:none}
  .carta p.nace{opacity:1;transition:none}
}
</style>
</head>
<body>

<div class="escena" id="escena">
  <div class="foto" id="foto"></div>
  <div class="bruma b1"></div><div class="rayos" id="rayos"></div><div class="bruma b2"></div>
  <div class="agua"><i></i></div><div class="bruma b3"></div>
</div>
<canvas id="luciernagas"></canvas>
<div class="vineta"></div>
<div class="hilo" aria-hidden="true"><i id="punto"></i></div>

<header class="portada">
  <h1 id="titulo"></h1>
  <p id="subtitulo"></p>
  <div class="orbe" aria-hidden="true"></div>
</header>
<main class="carta" id="carta"></main>
<footer class="final" id="final"></footer>

<script>
/* ================================================================
   ✏️  AQUÍ ESCRIBES TU CARTA
   - Separa los párrafos con una línea en blanco.
   - Puede ser tan larga como quieras: el bosque se adapta solo.
   ================================================================ */
const CARTA = {
  titulo: "Para mi Andi",
  subtitulo: "Feliz cumpleaños mi corazón",
  texto: `Hoy cumple años la persona más especial en mi vida y se que hoy los deseos los pides tú pero solo tengo un deseo mente. Que tu amor se quede a mi lado por el resto de mis días.

   La vida me regala un año más de ti y sé que aunque sea poco el tiempo que hemos compartido, el tiempo que nos falta es mucho más largo. A veces hablamos sobre que nos hubiera gustado conocernos antes, no sé si es el mejor deseo, solo sé que ya estamos aquí y agradezco a la vida que me diera la oportunidad de ocupar un tiempo y un espacio contigo. ¿Sabes? Suelo recuerdo como era mi vida antes de ti y lo mucho que ha cambiado todo desde que estamos juntos. Gracias mi vida por darle luz a la mía.

    Hay tanto que podría decir de ti que una vida no es suficiente. Eres mi solecito, mi cielo, mi mar y mi tierra, mi luna y mis estrellas, mi corazón y el aire que respiro. Mi novia, mi prometida, mi amante, mi esposa, mi mejor amiga y mi compañera de vida. Gracias por existir mi Andi.

    Tantas cosas pudieron haber sido diferentes en nuestras vidas, pero hoy estamos aquí, ganándole a las probabilidades. Y al final, un detalle tan simple como unas gomitas, cambiaron mi vida y espero que tambien la tuya de la mejor manera posible.

     Me dijiste que no te habían celebrado un cumpleaños de una forma que te gustara, espero que este año pueda hacerte sentir especial. Eres todo para mí y mereces sentirte especial en tu día. Se que a veces no soy muy expresivo pero me hace muy feliz tener la oportunidad de preparar algo para ti. Espero que aun con mis errores y las cosas que salieron mal planeando esto, sientas que todo lo hice con todo mi amor. Nunca había planeado algo así y me da mucho gusto saber que esta primera vez lo hice para ti.

     Solo quiero que sepas que, puse un poquito de mí en cada detalle de hoy, quizás no fue suficiente. Solo quiero que veas que todo lo hice con todo mi amor.

     Por cierto, cada uno de los regalos tiene un significado (:
`,
  firma: "Te ama con todo su corazón,\n Tu Javi",
  cierre: ""
};

/* ---------- Render ---------- */
const $ = id => document.getElementById(id);
$('titulo').textContent = CARTA.titulo; $('subtitulo').textContent = CARTA.subtitulo; $('final').textContent = CARTA.cierre || '';
const caja = $('carta');
CARTA.texto.trim().split(/\n\s*\n/).forEach(t => { const p = document.createElement('p'); p.className = 'nace'; p.textContent = t.trim(); caja.appendChild(p); });
{ const f = document.createElement('p'); f.className = 'firma nace'; f.textContent = CARTA.firma; caja.appendChild(f); }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let vista = false;
try {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('vista'); io.unobserve(e.target); } }), { threshold: .15 });
  caja.querySelectorAll('.nace').forEach(p => io.observe(p));
  new IntersectionObserver(es => vista = es[0].isIntersecting).observe(caja);
} catch (e) { caja.querySelectorAll('.nace').forEach(p => p.classList.add('vista')); vista = true; }

const bichos = Array.from({length: 30}, () => ({ ax: Math.random(), ay: Math.random(), z: rnd(.25,1.1), ph: rnd(0,6.28), v: rnd(.3,.9), dx: 0, dy: 0, c: Math.random() < .7 }));
const motas = Array.from({length: 36}, () => ({ x: rnd(.42,.88), y: rnd(.02,.5), ph: rnd(0,6.28), v: rnd(.15,.5), s: rnd(1.4,3) }));
const glints = Array.from({length: 22}, () => ({ x: rnd(.2,.95), y: rnd(.83,.99), ph: rnd(0,6.28), v: rnd(.8,2), w: rnd(8,26) }));
const hojas = Array.from({length: 5}, () => ({ x: Math.random(), y: Math.random(), z: rnd(.5,1.2), ph: rnd(0,6.28), v: rnd(.3,.7), r: rnd(0,6.28) }));
let chispas = [];
function dibujaHoja(x, y, s, a){ cx.save(); cx.translate(x,y); cx.rotate(a); cx.scale(s,s); cx.beginPath(); cx.moveTo(0,0); cx.bezierCurveTo(7,-5,10,-16,0,-26); cx.bezierCurveTo(-10,-16,-7,-5,0,0); cx.fill(); cx.restore(); }
const cuenta = a => Math.ceil(a.length*Q);

/* ---------- Calidad adaptable: mide la fluidez mientras se lee y se aligera si hace falta ---------- */
let ult = 0, ms = [], estables = 0;
function nivelar(n){ nivel = n; Q = [1,.6,.35][n]; const c = document.documentElement.classList; c.toggle('q1', n >= 1); c.toggle('q2', n >= 2); }
if ((navigator.hardwareConcurrency || 8) <= 4) nivelar(1);
function medir(t){
  if (reduce || !vista || estables >= 3) { ult = 0; return; }
  if (ult) { const d = t - ult; if (d < 200) ms.push(d); } ult = t;
  if (ms.length >= 100) { ms.sort((a,b) => a-b); const p75 = ms[Math.floor(ms.length*.75)]; ms = [];
    if (p75 > 26 && nivel < 2) { nivelar(nivel + 1); estables = 0; } else estables++; }
}

function pintar(t){
  pend = false; medir(t); const tt = reduce ? 0 : t/1000;
  mx += (tx - mx)*.06; my += (ty - my)*.06;
  const o = prog*(DH - H);
  ESC.style.transform = `translate3d(${(TX - mx*14).toFixed(1)}px,${(-o - my*8).toFixed(1)}px,0)`;
  PTO.style.transform = `translateY(${(prog*.76*H).toFixed(1)}px)`;
  cx.clearRect(0,0,W,H); cx.globalCompositeOperation = 'lighter';
  for (let i = 0, n = cuenta(motas); i < n; i++) { const m = motas[i];   // motas en el haz de luz (ligadas a la foto)
    const px = TX + (m.x + Math.sin(tt*m.v + m.ph)*.012)*DW, py = ((m.y*DH + tt*6*m.v) % (DH*.52)) - o;
    if (py < -10 || py > H + 10) continue; cx.globalAlpha = (.25 + .6*Math.abs(Math.sin(tt*m.v*2 + m.ph)))*.8; cx.drawImage(spAzul, px - m.s*2, py - m.s*2, m.s*4, m.s*4); }
  for (let i = 0, n = cuenta(glints); i < n; i++) { const g = glints[i], py = g.y*DH - o;   // destellos del agua
    if (py < -10 || py > H + 10) continue; const px = TX + g.x*DW + Math.sin(tt*.4 + g.ph)*10;
    cx.globalAlpha = Math.max(0, Math.sin(tt*g.v + g.ph))*.7; cx.drawImage(spAzul, px - g.w, py - 3, g.w*2, 6); }
  const span = H*1.5;
  for (let i = 0, n = cuenta(bichos); i < n; i++) { const b = bichos[i];   // luciérnagas (huyen del puntero)
    let px = b.ax*W + Math.sin(tt*b.v + b.ph)*38*b.z + Math.sin(tt*b.v*.37 + b.ph*2)*24*b.z - mx*30*b.z + b.dx;
    let py = b.ay*span - sy*.3*b.z + Math.cos(tt*b.v*.8 + b.ph)*24*b.z + b.dy;
    px = ((px % W) + W) % W; py = (((py % span) + span) % span) - H*.25;
    let boost = 0;
    if (ptr) { const ddx = px - ptr.x, ddy = py - ptr.y; if (Math.abs(ddx) < 150 && Math.abs(ddy) < 150) { const d = Math.hypot(ddx, ddy); if (d < 150) { const f = 1 - d/150; b.dx += ddx/(d || 1)*f*3; b.dy += ddy/(d || 1)*f*3; boost = f; } } }
    b.dx *= .96; b.dy *= .96;
    const sz = 14 + 30*b.z + boost*14; cx.globalAlpha = Math.min(1, (reduce ? .75 : .35 + .65*Math.abs(Math.sin(tt*b.v*1.4 + b.ph))) + boost*.4);
    cx.drawImage(b.c ? spCian : spAzul, px - sz/2, py - sz/2, sz, sz); }
  if (chispas.length) { chispas = chispas.filter(c => c.l > 0); for (const c of chispas) { c.x += c.vx; c.y += c.vy; c.vx *= .97; c.vy = c.vy*.97 - .01; c.l -= .012; cx.globalAlpha = Math.max(0, c.l); cx.drawImage(spCian, c.x - 14, c.y - 14, 28, 28); } }
  cx.globalCompositeOperation = 'source-over'; cx.fillStyle = 'rgba(2,10,30,.8)'; cx.globalAlpha = .55;   // hojas que caen
  for (let i = 0, n = cuenta(hojas); i < n; i++) { const h = hojas[i], hh = H*1.3;
    let px = h.x*W + Math.sin(tt*h.v + h.ph)*60 - mx*40*h.z; const py = ((h.y*hh + tt*22*h.v*h.z - sy*.18*h.z) % hh + hh) % hh - H*.15; px = ((px % W) + W) % W;
    dibujaHoja(px, py, 1.4*h.z, h.r + Math.sin(tt*h.v*1.5 + h.ph)*.9 + tt*.2); }
  cx.globalAlpha = 1;
  if (!reduce || chispas.length) req();
}
function req(){ if (!pend) { pend = true; requestAnimationFrame(pintar); } }
function leer(){ sy = scrollY; prog = Math.min(1, Math.max(0, sy/MAXS)); req(); }
addEventListener('scroll', leer, { passive: true });
addEventListener('resize', tam);
try { new ResizeObserver(medirDoc).observe(document.body); } catch (e) {}
addEventListener('pointermove', e => { tx = e.clientX/innerWidth - .5; ty = e.clientY/innerHeight - .5; ptr = { x: e.clientX, y: e.clientY }; req(); }, { passive: true });
addEventListener('pointerleave', () => { ptr = null; });
addEventListener('pointerdown', e => { for (let i = 0; i < 9; i++) { const a = Math.random()*6.28, v = rnd(.6,2.2); chispas.push({ x: e.clientX, y: e.clientY, vx: Math.cos(a)*v, vy: Math.sin(a)*v, l: rnd(.7,1.1) }); } req(); });
tam();
</script>
</body>
